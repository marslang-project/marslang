# Build the interpreter for every supported platform and attach the archives to
# the release for its tag, so `install.ps1` and `install.sh` have something to
# download and no one has to install Rust to run Marslang.
name: release

on:
  push:
    tags: ["rs-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing rs-X.Y.Z tag to build and upload"
        required: true

# Read-only by default: the build jobs compile and run third-party code (crate
# build scripts), so they must not hold a token that can change the repository
# or its releases. Only the last job, which publishes, can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag, passed to scripts as an environment variable rather than pasted
  # into them, so no tag name can become shell code.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, which run on every distribution, from
          # Alpine to old glibc systems. Each is built and tested on its own
          # architecture.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          # The Intel macOS build is tested under Rosetta on the Apple silicon runner.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Run the platform check
        shell: bash
        run: |
          set -eu
          binary="target/${{ matrix.target }}/release/marslang"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" tests/platform/check.mars

      - name: Package
        shell: bash
        run: |
          set -eu
          name="marslang-$TAG-${{ matrix.target }}"
          mkdir -p "staging/$name" dist
          cp README.md LICENSE.md "staging/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/marslang.exe" "staging/$name/"
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/marslang" "staging/$name/"
            tar -czf "dist/$name.tar.gz" -C staging "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance: anyone can check that an archive was built by
      # this workflow from this repository with `gh attestation verify`.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the archives and their checksums
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest where the archives came from
        uses: actions/attest@v4
        with:
          subject-path: "dist/marslang-*"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$TAG"
          notes="docs/releases/$tag.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # The release page is normally written by hand; create it only if the
            # tag was pushed without one, using the notes committed for it.
            if [ -f "$notes" ]; then
              gh release create "$tag" --title "Marslang $tag" --notes-file "$notes" --latest
            else
              gh release create "$tag" --title "Marslang $tag" --generate-notes --latest
            fi
          fi
          gh release upload "$tag" dist/* --clobber
