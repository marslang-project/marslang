[package]
name = "marslang"
version = "0.17.0"
edition = "2021"
description = "The Marslang interpreter."
homepage = "https://marslang.kevin-z.com"
repository = "https://github.com/marslang-project/marslang"
license-file = "LICENSE.md"

[dependencies]
indexmap = "2.14.2"
unicode-segmentation = "1.13.3"
# date, datetime, and duration: the calendar, time zones, and daylight saving.
# Everything but reading the system time zone, which on Windows links through
# raw-dylib and so needs a 64-bit dlltool that windows-gnu setups often lack;
# src/date.rs reads the Windows zone itself. The time zone database is built
# in as a fallback: the system's copy is used first, being kept up to date, but
# minimal Linux containers often have none.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline"] }
# std.file.toml: TOML 1.1 reading and writing, keeping key order.
toml = { version = "1.1.6", features = ["preserve_order"] }
# std.regex: matching in time proportional to the text, whatever the pattern.
# regex-syntax is the crate's own parser, used directly only to say where in a
# pattern an error is.
regex = "1.13.1"
regex-syntax = "0.8.11"
# std.format: how many terminal columns text takes, so tables line up when
# they hold Chinese, Japanese, Korean, or emoji, which take two.
unicode-width = "0.2.2"
# std.hash: SHA-256 and SHA-512 digests, in pure Rust so every release target builds.
sha2 = "0.11.1"
# std.hash: SHA-1 digests, in pure Rust (RustCrypto).
sha1 = "0.11.0"
# std.hash: MD5 digests, in pure Rust (RustCrypto); fine for checksums, not for security.
md-5 = "0.11.0"
# std.hash: HMAC-SHA-256, a keyed digest that proves a message came from someone holding the key.
hmac = "0.13.0"
# std.hash: CRC-32 checksums, in pure Rust, fast enough for large files.
crc32fast = "1.5.2"
# std.secrets: the operating system's cryptographically secure random bytes, for passwords, keys, and tokens.
# Version 0.2 is already in Cargo.lock through ring; 0.3+ links through raw-dylib on Windows, which this machine cannot build.
getrandom = "0.2.17"
# std.http: HTTP(S) over rustls with ring (not aws-lc-rs, which needs cmake) and built-in root certificates; SOCKS proxies too.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "socks-proxy"] }
# bigint: whole numbers of any size, and their arithmetic, in pure Rust. The
# long-proven 0.4 line: 0.5 is months old and has just fixed its new division.
num-bigint = "0.4.6"
# bigint: num-bigint's conversions to and from ints and floats, and its zero, one, and sign.
num-traits = "0.2.19"
# bigint: num-bigint's division with remainder, and whether a number is odd.
num-integer = "0.1.47"

[target.'cfg(not(windows))'.dependencies]
# Elsewhere jiff reads the system time zone itself (TZ, /etc/localtime).
jiff = { version = "0.2.37", default-features = false, features = ["tz-system"] }
# std.terminal: the terminal's size on Linux and macOS. On Windows
# std/rs/terminal.rs asks the console itself, as src/date.rs asks for the
# time zone, to stay clear of windows-sys, which links through raw-dylib.
terminal_size = "0.4.3"

[target.'cfg(target_env = "musl")'.dependencies]
# The Linux releases are static musl binaries, which run on every distribution.
# musl's own allocator made the interpreter about 55% slower; mimalloc restores
# the speed of a glibc build. Other builds keep the system allocator.
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
# Release binaries without their symbol tables: about 30% smaller (11.4 MB to
# 8.1 MB on Windows). A panic still prints its message; only a Rust backtrace
# would lose function names, and users never see one.
strip = true
