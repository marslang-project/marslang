[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marslang"
version = "0.4.0"
description = "Marslang v0.4 compiler"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
compiler = "marslang.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
