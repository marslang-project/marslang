[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marslang"
version = "0.2.0"
description = "Marslang v0.2 compiler"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
compiler = "marslang.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
